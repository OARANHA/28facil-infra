# =====================================================
# 28FACIL API - Stack com Traefik SSL
# Deploy DEPOIS do traefik-stack.yml
# =====================================================

version: '3.8'

services:
  # =====================================================
  # MYSQL - Banco de Dados
  # =====================================================
  mysql:
    image: mysql:8.0
    container_name: 28facil-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-senha_forte_123}
      MYSQL_DATABASE: ${DB_DATABASE:-28facil_api}
      MYSQL_USER: ${DB_USERNAME:-28facil}
      MYSQL_PASSWORD: ${DB_PASSWORD:-senha_forte_123}
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - 28facil-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-senha_forte_123}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =====================================================
  # API SERVER - 28Facil
  # =====================================================
  api-server:
    image: php:8.2-apache
    container_name: 28facil-api
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-28facil_api}
      DB_USERNAME: ${DB_USERNAME:-28facil}
      DB_PASSWORD: ${DB_PASSWORD:-senha_forte_123}
      JWT_SECRET: ${JWT_SECRET:-mude_isso_em_producao_para_chave_segura}
    networks:
      - 28facil-internal
      - traefik-public
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: /bin/bash
    command:
      - -c
      - |
        set -e
        
        echo "🚀 Instalando extensões PHP..."
        docker-php-ext-install pdo pdo_mysql mysqli > /dev/null 2>&1
        
        echo "🔧 Configurando Apache..."
        a2enmod rewrite > /dev/null 2>&1
        
        # Corrigir DocumentRoot apenas se necessário
        if ! grep -q "/var/www/html/public" /etc/apache2/sites-available/000-default.conf; then
          sed -i 's|DocumentRoot /var/www/html|DocumentRoot /var/www/html/public|g' /etc/apache2/sites-available/000-default.conf
        fi
        
        echo "📚 Baixando código da API..."
        apt-get update -qq > /dev/null 2>&1
        apt-get install -y -qq git curl > /dev/null 2>&1
        
        # Clonar ou atualizar repositório
        if [ ! -d "/var/www/html/.git" ]; then
          echo "Clonando repositório..."
          rm -rf /var/www/html/*
          git clone -q https://github.com/OARANHA/28facil-api.git /tmp/api
          cp -r /tmp/api/* /var/www/html/
          cp -r /tmp/api/.git /var/www/html/
          rm -rf /tmp/api
        else
          echo "Atualizando repositório..."
          cd /var/www/html
          git pull -q
        fi
        
        # Permissões
        chown -R www-data:www-data /var/www/html
        chmod -R 755 /var/www/html
        
        echo "✅ API pronta! Iniciando Apache..."
        apache2-foreground
    
    labels:
      # Habilitar Traefik
      - "traefik.enable=true"
      
      # Rede que o Traefik vai usar
      - "traefik.docker.network=traefik-public"
      
      # Roteamento HTTP -> HTTPS (redirect automático)
      - "traefik.http.routers.api-http.rule=Host(`api.28facil.com.br`)"
      - "traefik.http.routers.api-http.entrypoints=web"
      - "traefik.http.routers.api-http.middlewares=redirect-to-https"
      
      # Roteamento HTTPS
      - "traefik.http.routers.api-https.rule=Host(`api.28facil.com.br`)"
      - "traefik.http.routers.api-https.entrypoints=websecure"
      - "traefik.http.routers.api-https.tls=true"
      - "traefik.http.routers.api-https.tls.certresolver=letsencrypt"
      
      # Serviço (porta interna do container)
      - "traefik.http.services.api-service.loadbalancer.server.port=80"
      
      # Middleware de redirect
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"

networks:
  traefik-public:
    external: true
  28facil-internal:
    driver: bridge

volumes:
  mysql-data:
